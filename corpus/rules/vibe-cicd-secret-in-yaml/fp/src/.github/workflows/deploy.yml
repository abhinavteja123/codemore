name: Deploy
on: [push]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # secrets referenced via the vault, NOT inlined as literals
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: npm test
      - name: Call upstream
        # use action input or env var; never echo the secret to the log
        env:
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
        run: |
          curl -X POST https://api.example.com -d '{"ok": true}'
