name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        env:
          CODEMORE_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile (extension + daemon + webview)
        run: npm run compile

      - name: Unit tests
        run: npm run test:unit

  schema-check:
    name: Report schema check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        env:
          CODEMORE_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Verify shared/report/schema.json is valid JSON Schema
        run: |
          node -e "const s = require('./shared/report/schema.json'); if (!s['\$schema']) { throw new Error('schema missing \$schema'); } console.log('schema ok:', s.\$id);"

  self-scan:
    name: Self-scan (CodeMore on CodeMore)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        env:
          CODEMORE_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci
      - name: Compile
        run: npm run compile
      - name: Build publish bundle
        run: npm run build:publish
      - name: Self-scan (fail on any BLOCKER)
        run: node cli.js scan . --enable-experimental --fail-on BLOCKER
      - name: Rule-PR validator (must pass)
        run: node scripts/validate-rule-pr.js
